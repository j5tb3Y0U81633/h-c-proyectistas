<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - H&C Proyectistas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F4F5F6;
            color: #263238;
            font-size: 20px;
            text-align: center;
            line-height: 1.6;
        }

        header {
            background-color: #D97706;
            color: white;
            padding: 25px;
        }
         nav {
            background-color: #37474F;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 8px;
        }

        nav a:hover {
            color: #FFB700;
        }
        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 20px;
            padding: 20px;
        }

        section {
            background-color: white;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 35px;
            border: 1px solid #DDDDDD;
            border-radius: 10px;
        }

        h2 {
            background-color: #37474F;
            color: white;
            padding: 15px;
            border-left: 5px solid #E67E22;
            border-radius: 6px;
        }

       
        .correo {
            display: inline-block;
            color: #D97706;
            font-weight: bold;
            text-decoration: none;
            overflow-wrap: anywhere;
            transition: color 0.3s;
        }

        .correo:hover {
            color: #37474F;
            text-decoration: underline;
        }

       
        .boton {
            display: inline-block;
            background-color: #E67E22;
            color: white;
            padding: 12px 25px;
            margin-top: 15px;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .boton:hover {
            background-color: #CF6D17;
        }

        footer {
            background-color: #37474F;
            color: white;
            padding: 15px;
            font-size: 15px;
        }

        /* accesibilidad para tablets */
        @media (max-width: 900px) {
            section {
                padding: 25px;
            }
        }

        /* accesibilidad para celulares */
        @media (max-width: 600px) {
            body {
                font-size: 16px;
            }

            header {
                padding: 15px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 22px;
            }

            main {
                padding: 12px;
            }

            section {
                padding: 18px;
            }

            .boton {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>H&C Proyectistas</h1>
    </header>
     <nav>

        <a href="porquenosotros.html">¿Por qué nosotros?</a>
        <a href="contacto.html">Contacto</a>
    </nav>


    <main>
        <section>
            <h2>Contacto</h2>

            <p>
                Si deseas ponerte en contacto con nosotros,
                puedes enviarnos un correo electrónico a:
            </p>

            <p>
                <a class="correo"
                   href="mailto:hycproyectistas@gmail.com">
                    hycproyectistas@gmail.com
                </a>
            </p>

            <a class="boton"
               href="https://mail.google.com/mail/u/0/#inbox?compose=DmwnWtMgBvcRHnHkMJtWWQWpCPTrDKQrzFqvnTRvVVzRPXxzqGXNKkFtbdFsNmxnQRnBbJPCzLpB" target="_blank">
                Enviar correo
            </a>
        </section>
    </main>

    <footer>

    </footer>

</body>
</html>
